<nav class="navbar">

    <!-- LOGO -->
    <div class="logo" onclick="goHome()" title="TaskHero Home">
        <div class="logo-icon">T</div>
        TaskHero
    </div>

    <!-- MAIN LINKS (icon-only with tooltips) -->
    <div class="nav-links">
        <!-- Home -->
        <button class="nav-button nav-icon-btn" onclick="goHome()" title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
                <path d="M9 21V12h6v9"/>
            </svg>
            <span class="nav-tooltip">Home</span>
        </button>

        <!-- My Tasks -->
        <button class="nav-button nav-icon-btn" onclick="myTasks()" title="My Tasks" aria-label="My Tasks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
            <span class="nav-tooltip">My Tasks</span>
        </button>

        <!-- Messages -->
        <button class="nav-button nav-icon-btn" onclick="messages()" title="Messages" aria-label="Messages">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span class="nav-tooltip">Messages</span>
        </button>

        <!-- mobile-only shortcuts -->
        <button class="nav-button nav-icon-btn mobile-nav-button" onclick="postTask()" title="Post Task" aria-label="Post Task">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <span class="nav-tooltip">Post</span>
        </button>

        <button class="nav-button nav-icon-btn mobile-nav-button" onclick="profile()" title="Profile" aria-label="Profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <span class="nav-tooltip">Profile</span>
        </button>
    </div>

    <!-- USER SEARCH -->
    <div class="nav-user-search" id="navUserSearch">
        <div class="nav-search-wrap">
            <span class="nav-search-icon" aria-hidden="true">⌕</span>
            <input
                type="text"
                id="navSearchInput"
                class="nav-search-input"
                placeholder="Search users…"
                autocomplete="off"
                aria-label="Search users by name"
                oninput="navUserSearchInput(this.value)"
                onfocus="navUserSearchInput(this.value)"
            >
        </div>
        <div class="nav-search-dropdown" id="navSearchDropdown" role="listbox" aria-label="Search results"></div>
    </div>

    <!-- RIGHT ACTIONS -->
    <div class="nav-actions">
        <!-- Post Task pill -->
        <button class="icon-button post-task-button" onclick="postTask()" title="Post a Task" aria-label="Post a Task">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="flex-shrink:0">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Post Task
        </button>

        <!-- Notifications -->
        <button class="icon-button" id="notif-btn" onclick="notifications()" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </button>

        <!-- Theme toggle -->
        <button class="icon-button" id="themeButton" onclick="toggleDarkMode()" title="Toggle theme" aria-label="Toggle theme">
            <svg id="themeIconLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg id="themeIconDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="display:none">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>

        <!-- Sign out -->
        <button class="icon-button nav-logout-button" onclick="signOut()" title="Sign out" aria-label="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </div>

    <!-- PROFILE AVATAR + dropdown menu -->
    <div class="nav-icons" style="position:relative">
        <button class="icon-button nav-profile-btn" id="navProfileBtn"
                onclick="toggleProfileMenu(event)"
                title="Account menu" aria-label="Account menu"
                aria-haspopup="true" aria-expanded="false">
            <span id="navProfileAvatar" class="nav-profile-avatar">?</span>
        </button>

        <!-- Dropdown -->
        <div class="nav-profile-menu" id="navProfileMenu" role="menu" aria-label="Account menu">
            <div class="nav-profile-menu-user" id="navProfileMenuUser">
                <div class="npm-avatar" id="navMenuAvatar"></div>
                <div class="npm-info">
                    <div class="npm-name"  id="navMenuName">—</div>
                    <div class="npm-email" id="navMenuEmail">—</div>
                </div>
            </div>
            <div class="nav-profile-menu-divider"></div>
            <button class="nav-profile-menu-item" role="menuitem" onclick="profile();closeProfileMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
                    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
                View Profile
            </button>
            <button class="nav-profile-menu-item npm-signout" role="menuitem" onclick="signOut()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sign Out
            </button>
        </div>
    </div>

</nav>
