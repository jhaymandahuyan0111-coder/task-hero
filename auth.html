<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHero - Sign in</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #f7fcf9; color: #091413; }
        body::before { display: none; }
        .auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .auth-card { width: min(100%, 430px); padding: 36px; background: #fff; border: 1px solid #b0e4cc; border-radius: 12px; box-shadow: 0 14px 36px rgba(9,20,19,.1); }
        .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 34px; font-weight: 800; font-size: 20px; }
        .auth-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; background: #091413; color: #fff; }
        .auth-card h1 { margin-bottom: 8px; font-size: 32px; letter-spacing: -.04em; }
        .auth-subtitle { margin-bottom: 26px; color: #285a48; font-size: 14px; line-height: 1.5; }
        .auth-form { display: grid; gap: 16px; }
        .auth-field { display: grid; gap: 7px; }
        .auth-field label { font-size: 13px; font-weight: 700; }
        .auth-field input { width: 100%; padding: 12px 13px; border: 1px solid #b0e4cc; border-radius: 6px; background: #f7fcf9; color: #091413; font: inherit; }
        .auth-field input:focus { outline: 3px solid rgba(64,138,113,.18); border-color: #408a71; }
        .auth-submit { margin-top: 4px; padding: 12px; border: 0; border-radius: 6px; background: #408a71; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
        .auth-submit:hover { background: #285a48; }
        .auth-submit:disabled { cursor: wait; opacity: .7; }
        .auth-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #6b7478; font-size: 12px; }
        .auth-divider::before, .auth-divider::after { content: ""; height: 1px; flex: 1; background: #b0e4cc; }
        .google-button { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 11px 12px; border: 1px solid #b0e4cc; border-radius: 6px; background: #fff; color: #091413; font: inherit; font-weight: 700; cursor: pointer; }
        .google-button:hover { background: #f3faf6; border-color: #408a71; }
        .google-mark { display: grid; place-items: center; width: 20px; height: 20px; border: 2px solid #408a71; border-radius: 50%; color: #285a48; font-size: 12px; font-weight: 800; }
        .auth-error { min-height: 18px; color: #a52e2e; font-size: 13px; }
        .auth-switch { margin-top: 22px; text-align: center; color: #285a48; font-size: 13px; }
        .auth-switch button { border: 0; padding: 0; background: none; color: #285a48; font: inherit; font-weight: 800; cursor: pointer; text-decoration: underline; }
        .auth-return { display: block; margin: 18px auto 0; border: 0; background: none; color: #285a48; font: inherit; font-size: 13px; cursor: pointer; }
        @media (max-width: 480px) { .auth-shell { padding: 16px; } .auth-card { padding: 28px 22px; } }
    </style>
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="authTitle">
            <div class="auth-brand"><span class="auth-mark">T</span> TaskHero</div>
            <h1 id="authTitle">Sign in</h1>
            <p class="auth-subtitle" id="authSubtitle">Sign in to manage tasks and message people directly.</p>
            <form class="auth-form" id="authForm">
                <div class="auth-field" id="nameField" hidden>
                    <label for="name">Full name</label>
                    <input id="name" name="name" type="text" autocomplete="name">
                </div>
                <div class="auth-field">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" minlength="6" autocomplete="current-password" required>
                </div>
                <p class="auth-error" id="authError" role="alert"></p>
                <button class="auth-submit" id="authSubmit" type="submit">Sign in</button>
            </form>
            <div class="auth-divider">or</div>
            <button class="google-button" id="googleButton" type="button"><span class="google-mark">G</span> Continue with Google</button>
            <p class="auth-error" id="googleError" role="status"></p>
            <p class="auth-switch"><span id="switchPrompt">New to TaskHero?</span> <button type="button" id="switchMode">Create an account</button></p>
            <button class="auth-return" type="button" onclick="window.location.href='home.html'">← Return to browse</button>
        </section>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
