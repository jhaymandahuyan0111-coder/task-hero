<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHero - Browse Tasks</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
/* ── PAGE HEADER ─────────────────────────────────────── */
.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}
.page-header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
}
.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}
.search-box {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 260px;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.search-box:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(91,75,248,0.1);
}
.search-box input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 14px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    box-shadow: none !important;
    padding: 0;
    height: auto;
}
.search-icon { color: var(--text-sub); font-size: 14px; flex-shrink: 0; }

/* ── STATS ROW ───────────────────────────────────────── */
.stats-row {
    display: flex;
    gap: 32px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.stat-item {}
.stat-number {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
}
.stat-label {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 1px;
}

/* ── FILTER BAR ──────────────────────────────────────── */
.filter-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 0;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}
.filter-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-sub);
    font-family: inherit;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.filter-btn:hover {
    border-color: var(--text);
    color: var(--text);
}
.filter-btn.active {
    background: var(--text);
    border-color: var(--text);
    color: var(--card);
}

/* ── TASK TABLE ──────────────────────────────────────── */
.task-grid {
    display: block;
}
.task-card {
    display: grid;
    grid-template-columns: 140px 1fr 130px 100px 90px 110px;
    gap: 16px;
    align-items: center;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
    background: transparent;
    transition: background 0.1s;
    cursor: default;
}
.task-card:last-child { border-bottom: none; }
.task-card:hover { background: var(--surface); }
.category-tag {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.task-main { min-width: 0; }
.task-card h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.task-desc {
    color: var(--text-sub);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.task-meta-cell {
    font-size: 12px;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.task-budget {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
}
.accept-button {
    padding: 7px 14px;
    border: 1px solid var(--primary);
    border-radius: 6px;
    background: transparent;
    color: var(--primary);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
}
.accept-button:hover {
    background: var(--primary);
    color: white;
}

/* ── NO RESULTS ──────────────────────────────────────── */
.no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-sub);
    grid-column: 1/-1;
}
.no-results h3 { margin-bottom: 6px; font-size: 16px; font-weight: 600; color: var(--text); }

/* ── ACCEPT MODAL ────────────────────────────────────── */
.accept-modal-body { margin-bottom: 20px; }
.task-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 14px;
}
.task-preview h3 { font-size: 15px; color: var(--text); margin-bottom: 4px; font-weight: 600; }
.task-preview p  { font-size: 13px; color: var(--text-sub); margin: 0; }

/* ── DARK MODE ───────────────────────────────────────── */
body.dark-mode .search-box { background: var(--card); border-color: var(--border); }
body.dark-mode .search-box input { color: var(--text); }
body.dark-mode .filter-btn { border-color: var(--border); color: var(--text-sub); }
body.dark-mode .filter-btn:hover { border-color: var(--text); color: var(--text); }
body.dark-mode .filter-btn.active { background: var(--text); border-color: var(--text); color: var(--card); }
body.dark-mode .task-card h3 { color: var(--text); }
body.dark-mode .task-desc { color: var(--text-sub); }
body.dark-mode .task-meta-cell { color: var(--text-sub); }
body.dark-mode .task-budget { color: var(--text); }
body.dark-mode .task-preview { background: var(--surface); border-color: var(--border); }
body.dark-mode .task-preview h3 { color: var(--text); }
body.dark-mode .task-preview p { color: var(--text-sub); }
body.dark-mode .no-results h3 { color: var(--text); }

/* ── RESPONSIVE ───────────────────────────────────────── */
@media (max-width: 900px) {
    .task-card {
        grid-template-columns: 1fr auto;
        gap: 8px 16px;
    }
    .category-tag { grid-column: 1; }
    .task-main    { grid-column: 1 / -1; }
    .task-meta-cell:first-of-type { grid-column: 1; }
    .task-budget  { grid-column: 2; text-align: right; }
    .accept-button { grid-column: 1 / -1; }
    .search-box   { width: 100%; }
    .page-header  { flex-direction: column; align-items: flex-start; }
    .header-right { width: 100%; flex-direction: column; align-items: stretch; }
}

@media (max-width: 600px) {
    .filter-bar { flex-wrap: nowrap; overflow-x: auto; }
    .filter-btn { flex: 0 0 auto; }
    .stats-row  { gap: 20px; }
}
    </style>
</head>
<body>

    <div id="shared-navigation"></div>

    <section class="page-container">

        <!-- Page Header -->
        <div class="page-header">
            <h1>Browse Tasks</h1>
            <div class="header-right">
                <div class="search-box">
                    <span class="search-icon" aria-hidden="true">⌕</span>
                    <input type="text" id="searchInput" placeholder="Search tasks, locations..." oninput="filterTasks()">
                </div>
                <button class="primary-button" onclick="postTask()">+ Post Task</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row" id="statsBar">
            <div class="stat-item"><div class="stat-number" id="statOpen">—</div><div class="stat-label">Open Tasks</div></div>
            <div class="stat-item"><div class="stat-number" id="statCompleted">—</div><div class="stat-label">Completed</div></div>
            <div class="stat-item"><div class="stat-number" id="statUsers">—</div><div class="stat-label">Active Users</div></div>
            <div class="stat-item"><div class="stat-number" id="statPaid">—</div><div class="stat-label">Paid Out</div></div>
        </div>

        <!-- Filters -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn" onclick="setFilter('Image Editing', this)">Image Editing</button>
            <button class="filter-btn" onclick="setFilter('Delivery', this)">Delivery</button>
            <button class="filter-btn" onclick="setFilter('Computer / IT', this)">Computer / IT</button>
            <button class="filter-btn" onclick="setFilter('Cleaning', this)">Cleaning</button>
            <button class="filter-btn" onclick="setFilter('Moving', this)">Moving</button>
            <button class="filter-btn" onclick="setFilter('Graphic Design', this)">Graphic Design</button>
            <button class="filter-btn" onclick="setFilter('Other', this)">Other</button>
        </div>

        <!-- Task List -->
        <div class="task-grid" id="taskGrid"></div>

    </section>

    <!-- Accept Modal -->
    <div class="modal-overlay" id="acceptModal">
        <div class="modal-box">
            <h2>Accept this task?</h2>
            <div class="accept-modal-body">
                <div class="task-preview">
                    <h3 id="modalTaskName"></h3>
                    <p id="modalTaskDetails"></p>
                </div>
                <p>Once you accept, the task will appear in <strong>My Tasks</strong> and the poster will be notified.</p>
            </div>
            <div class="modal-buttons">
                <button class="modal-cancel" onclick="closeAcceptModal()">Cancel</button>
                <button class="modal-confirm" onclick="confirmAccept()">Accept Task</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let allTasks = [], currentFilter = "all", pendingTask = null;

        function loadTasks() {
            const stored = JSON.parse(localStorage.getItem("taskhero-tasks") || "[]");
            const user = currentUser();
            // Filter out closed tasks AND tasks the current user posted (can't accept own)
            allTasks = stored.filter(t => t.status === "open" && (!user || t.postedBy !== user.id));
            renderTasks();
            updateStats();
        }

        function renderTasks() {
            const grid = document.getElementById("taskGrid");
            const search = document.getElementById("searchInput").value.toLowerCase();
            let filtered = allTasks.filter(task => {
                const mf = currentFilter === "all" || task.category === currentFilter;
                const ms = !search || task.title.toLowerCase().includes(search) || task.category.toLowerCase().includes(search) || task.location.toLowerCase().includes(search) || task.description.toLowerCase().includes(search);
                return mf && ms;
            });
            if (!filtered.length) {
                grid.innerHTML = `<div class="no-results"><h3>No tasks found</h3><p>Try a different search or category filter.</p></div>`;
                return;
            }
            grid.innerHTML = filtered.map(task => `
                <div class="task-card" data-id="${task.id}">
                    <span class="category-tag">${escHtml(task.category)}</span>
                    <div class="task-main">
                        <h3>${escHtml(task.title)}</h3>
                        <p class="task-desc">${escHtml(task.description)}</p>
                    </div>
                    <span class="task-meta-cell">${escHtml(task.location)}</span>
                    <span class="task-meta-cell">${task.deadline ? formatDate(task.deadline) : "Flexible"}</span>
                    <span class="task-budget">₱${Number(task.budget).toLocaleString()}</span>
                    <button class="accept-button" onclick="openAcceptModal('${task.id}')">Accept</button>
                </div>`).join("");
        }

        function setFilter(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderTasks();
        }

        function filterTasks() { renderTasks(); }

        function openAcceptModal(id) {
            pendingTask = allTasks.find(t => t.id === id);
            if (!pendingTask) return;
            document.getElementById("modalTaskName").innerText = pendingTask.title;
            document.getElementById("modalTaskDetails").innerText = `${pendingTask.location}  ·  ₱${Number(pendingTask.budget).toLocaleString()}`;
            document.getElementById("acceptModal").classList.add("open");
        }

        function closeAcceptModal() {
            document.getElementById("acceptModal").classList.remove("open");
            pendingTask = null;
        }

        function confirmAccept() {
            if (!pendingTask) return;
            const acc = JSON.parse(localStorage.getItem("taskhero-accepted") || "[]");
            if (!acc.find(t => t.id === pendingTask.id)) {
                acc.push({ ...pendingTask, acceptedAt: new Date().toISOString() });
                localStorage.setItem("taskhero-accepted", JSON.stringify(acc));
            }
            closeAcceptModal();
            showToast(`Accepted: ${pendingTask.title}`, "success");
            allTasks = allTasks.filter(t => t.id !== pendingTask.id);
            pendingTask = null;
            renderTasks();
            updateStats();
        }

        document.getElementById("acceptModal").addEventListener("click", function(e) { if (e.target === this) closeAcceptModal(); });

        function updateStats() {
            const acc = JSON.parse(localStorage.getItem("taskhero-accepted") || "[]");
            const totalPaid = acc.reduce((s, t) => s + Number(t.budget || 0), 0);
            document.getElementById("statOpen").innerText = allTasks.length;
            document.getElementById("statCompleted").innerText = acc.filter(t => t.status === "completed").length;
            document.getElementById("statUsers").innerText = "—";
            document.getElementById("statPaid").innerText = "₱" + totalPaid.toLocaleString();
        }

        function escHtml(str) { return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
        function formatDate(d) { if (!d) return ""; return new Date(d).toLocaleDateString("en-PH", { month: "short", day: "numeric" }); }

        document.addEventListener("DOMContentLoaded", loadTasks);
    </script>
</body>
</html>
