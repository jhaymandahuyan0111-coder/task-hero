<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHero - Messages</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
.messages-layout {
    height: calc(100vh - 70px);
    display: grid; grid-template-columns: 330px 1fr;
}
/* LEFT */
.convo-panel {
    border-right: 1.5px solid rgba(91,75,248,0.1);
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(14px);
    display: flex; flex-direction: column; overflow: hidden;
}
.convo-header { padding: 24px 20px 14px; border-bottom: 1px solid rgba(91,75,248,0.08); flex-shrink: 0; }
.convo-header h1 { font-size: 22px; font-weight: 800; margin-bottom: 3px; letter-spacing: -0.4px; }
.convo-header p  { color: #9ca3af; font-size: 13px; }
.convo-search { padding: 12px 16px; flex-shrink: 0; }
.convo-search input {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid rgba(91,75,248,0.15);
    border-radius: 12px; font-size: 13px; outline: none;
    background: var(--surface); font-family: inherit;
    transition: all 0.18s; color: var(--text);
}
.convo-search input:focus { border-color: #7c6cff; background: white; box-shadow: 0 0 0 3px rgba(91,75,248,0.08); }
.user-search { padding: 0 16px 12px; }
.user-search input { width: 100%; padding: 10px 14px; border: 1px solid #b0e4cc; border-radius: 8px; background: #f7fcf9; color: var(--text); font: inherit; font-size: 13px; outline: none; }
.user-search input:focus { border-color: #408a71; }
.user-results { max-height: 180px; overflow-y: auto; padding: 0 16px 8px; }
.user-result { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 0; border: 0; border-bottom: 1px solid #b0e4cc; background: transparent; color: var(--text); text-align: left; font: inherit; cursor: pointer; }
.user-result:hover { color: #285a48; }
.user-result-avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #408a71; color: #fff; font-size: 12px; font-weight: 800; }
.user-result-name { font-size: 13px; font-weight: 700; }
.user-result-email { display: block; color: #6b7478; font-size: 11px; }
.convo-list { flex: 1; overflow-y: auto; }
/* CONVO ITEM */
.convo-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.12s; position: relative;
}
.convo-item:hover { background: rgba(91,75,248,0.04); }
.convo-item.active {
    background: #f3faf6;
    border-left-color: #5b4bf8;
}
.avatar {
    width: 46px; height: 46px; min-width: 46px;
    border-radius: 50%;
    background: #408a71;
    color: white; font-weight: 800; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 3px 0 #4535d4, 0 5px 14px rgba(91,75,248,0.35);
}
.avatar .online-dot { position: absolute; bottom: 1px; right: 1px; width: 12px; height: 12px; background: #10b981; border-radius: 50%; border: 2px solid white; }
.convo-meta { flex: 1; min-width: 0; }
.convo-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.convo-name { font-weight: 700; font-size: 14px; }
.convo-time { font-size: 11px; color: #9ca3af; }
.convo-preview { font-size: 13px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unread-badge {
    min-width: 20px; height: 20px; padding: 0 6px;
    background: #285a48;
    color: white; font-size: 10px; font-weight: 800;
    border-radius: 999px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(91,75,248,0.35);
}
/* RIGHT */
.chat-panel { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af; gap: 12px; }
.chat-empty .empty-icon { font-size: 56px; filter: drop-shadow(0 6px 16px rgba(91,75,248,0.2)); }
/* CHAT HEADER */
.chat-header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(91,75,248,0.08);
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(91,75,248,0.06);
}
.chat-user-info h2 { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
.online-label { font-size: 12px; color: #10b981; font-weight: 600; }
.chat-header-actions { margin-left: auto; display: flex; gap: 8px; }
.chat-action-btn {
    padding: 7px 14px;
    border: 1.5px solid rgba(91,75,248,0.18);
    border-radius: 10px; background: var(--surface);
    font-size: 12px; font-weight: 600; cursor: pointer;
    color: #5b4bf8; font-family: inherit;
    box-shadow: var(--clay-shadow-sm); transition: all 0.15s;
}
.chat-action-btn:hover { background: white; transform: translateY(-1px); box-shadow: var(--clay-shadow); }
/* TASK BANNER */
.task-banner {
    margin: 12px 18px 0;
    padding: 11px 16px;
    background: #b0e4cc;
    border: 1px solid rgba(91,75,248,0.15);
    border-radius: 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    box-shadow: var(--clay-shadow-sm);
}
.task-banner-icon { font-size: 17px; }
.task-banner-info .task-label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: #5b4bf8; }
.task-banner-info .task-name { font-size: 13px; font-weight: 700; color: var(--text); }
/* MESSAGES */
.chat-messages { flex: 1; padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.date-separator { text-align: center; font-size: 10px; color: #9ca3af; margin: 8px 0; position: relative; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.date-separator::before,.date-separator::after { content:""; position:absolute; top:50%; width:35%; height:1px; background:rgba(91,75,248,0.12); }
.date-separator::before { left:0; } .date-separator::after { right:0; }
/* BUBBLES */
.message { max-width: 62%; padding: 11px 15px; font-size: 14px; line-height: 1.52; word-break: break-word; }
.message.received {
    align-self: flex-start;
    background: white;
    border: 1.5px solid rgba(91,75,248,0.1);
    border-radius: 18px 18px 18px 4px;
    color: var(--text);
    box-shadow: var(--clay-shadow-sm);
}
.message.sent {
    align-self: flex-end;
    background: #408a71;
    color: white;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 3px 0 #4535d4, 0 5px 16px rgba(91,75,248,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
}
.msg-time { display: block; font-size: 10px; margin-top: 5px; opacity: 0.6; }
/* TYPING */
.typing-indicator { display: none; align-self: flex-start; background: white; border: 1.5px solid rgba(91,75,248,0.1); border-radius: 18px 18px 18px 4px; padding: 12px 16px; gap: 5px; box-shadow: var(--clay-shadow-sm); }
.typing-indicator.show { display: flex; align-items: center; }
.typing-dot { width: 7px; height: 7px; background: #a78bfa; border-radius: 50%; animation: typingBounce 1.2s infinite; }
.typing-dot:nth-child(2){animation-delay:0.2s;}.typing-dot:nth-child(3){animation-delay:0.4s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
/* INPUT */
.msg-input-area { padding: 14px 18px; background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); border-top: 1px solid rgba(91,75,248,0.08); flex-shrink: 0; }
.msg-form { display: flex; align-items: center; gap: 10px; }
.msg-input {
    flex: 1; padding: 12px 18px;
    border: 1.5px solid rgba(91,75,248,0.15);
    border-radius: 999px; outline: none; font-size: 14px;
    font-family: inherit; background: var(--surface);
    color: var(--text); transition: all 0.18s;
}
.msg-input:focus { border-color: #7c6cff; background: white; box-shadow: 0 0 0 3px rgba(91,75,248,0.1); }
.send-btn {
    width: 46px; height: 46px; border: none; border-radius: 50%;
    background: #408a71;
    color: white; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 3px 0 #4535d4, 0 5px 16px rgba(91,75,248,0.35);
    transition: all 0.18s;
}
.send-btn:hover { transform: scale(1.08) translateY(-1px); box-shadow: 0 5px 0 #4535d4, 0 10px 24px rgba(91,75,248,0.45); }

/* DARK MODE */
body.dark-mode .convo-panel { background: rgba(22,18,40,0.85); border-color: rgba(124,108,255,0.1); }
body.dark-mode .convo-header { border-color: rgba(124,108,255,0.08); }
body.dark-mode .convo-header p,.convo-header p { color: #6b7280; }
body.dark-mode .convo-search input { background: rgba(255,255,255,0.05); border-color: rgba(124,108,255,0.18); color: #e5e3ff; }
body.dark-mode .convo-item:hover { background: rgba(124,108,255,0.06); }
body.dark-mode .convo-item.active { background: rgba(91,75,248,0.12); }
body.dark-mode .convo-name { color: #e5e3ff; }
body.dark-mode .chat-panel { background: #0e0c1a; }
body.dark-mode .chat-header { background: rgba(22,18,40,0.85); border-color: rgba(124,108,255,0.08); }
body.dark-mode .chat-user-info h2 { color: #e5e3ff; }
body.dark-mode .task-banner { background: rgba(91,75,248,0.12); border-color: rgba(124,108,255,0.2); }
body.dark-mode .task-banner-info .task-name { color: #e5e3ff; }
body.dark-mode .message.received { background: #1a1628; border-color: rgba(124,108,255,0.12); color: #e5e3ff; }
body.dark-mode .typing-indicator { background: #1a1628; border-color: rgba(124,108,255,0.12); }
body.dark-mode .msg-input-area { background: rgba(22,18,40,0.85); border-color: rgba(124,108,255,0.08); }
body.dark-mode .msg-input { background: rgba(255,255,255,0.05); border-color: rgba(124,108,255,0.18); color: #e5e3ff; }
body.dark-mode .msg-input:focus { background: rgba(255,255,255,0.08); }
body.dark-mode .chat-action-btn { background: rgba(255,255,255,0.05); border-color: rgba(124,108,255,0.2); color: #c4b5fd; }
body.dark-mode .date-separator::before,.dark-mode .date-separator::after { background: rgba(124,108,255,0.12); }

@media (max-width: 800px) {
    .messages-layout { grid-template-columns: 1fr; height: calc(100vh - 130px); }
    .convo-panel { display: none; }
    .convo-panel.mobile-show { display: flex; position: fixed; inset: 0; z-index: 500; }
}
    </style>
</head>
<body>
    <div id="shared-navigation"></div>
    <div class="messages-layout">
        <aside class="convo-panel" id="convoPanel">
            <div class="convo-header">
                <h1>Messages</h1>
                <p>Your conversations</p>
            </div>
            <div class="convo-search">
                <input type="text" id="convoSearch" placeholder="Search conversations..." oninput="filterConvos()">
            </div>
            <div class="user-search"><input type="search" id="userSearch" placeholder="Find a user to message..." oninput="searchUsers()"></div>
            <div class="user-results" id="userResults"></div>
            <div class="convo-list" id="convoList"></div>
        </aside>

        <main class="chat-panel" id="chatPanel">
            <div class="chat-empty" id="chatEmpty">
                <div class="empty-icon">—</div>
                <strong>Select a conversation</strong>
                <span style="font-size:14px">Choose someone from the left to start chatting.</span>
            </div>
            <div id="chatView" style="display:none;flex-direction:column;height:100%">
                <div class="chat-header">
                    <div class="avatar" id="chatAvatar" style="cursor:default">A</div>
                    <div class="chat-user-info">
                        <h2 id="chatName">Conversation</h2>
                        <span class="online-label" id="chatStatus">● Online</span>
                    </div>
                    <div class="chat-header-actions">
                        <button class="chat-action-btn" onclick="viewTaskDetails()">View Task</button>
                        <button class="chat-action-btn" onclick="goToMyTasks()">My Tasks</button>
                    </div>
                </div>
                <div class="task-banner" id="taskBanner">
                    <span class="task-banner-icon">•</span>
                    <div class="task-banner-info">
                        <div class="task-label">TASK</div>
                        <div class="task-name" id="chatTaskName">No task selected</div>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                </div>
                <div class="msg-input-area">
                    <form class="msg-form" onsubmit="sendMessage(event)">
                        <input type="text" class="msg-input" id="msgInput" placeholder="Type a message…" autocomplete="off">
                        <button type="submit" class="send-btn" id="sendBtn" title="Send">➤</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        const CONVERSATIONS=[];
        let activeConvo=null, localMessages={};
        function renderConvoList(filter=""){
            const list=document.getElementById("convoList");
            const filtered=CONVERSATIONS.filter(c=>c.name.toLowerCase().includes(filter)||c.task.toLowerCase().includes(filter)||(c.messages.at(-1)?.text||"").toLowerCase().includes(filter));
            list.innerHTML=filtered.map(c=>{const lastMsg=c.messages.at(-1)?.text||"";return`<div class="convo-item ${activeConvo===c.id?"active":""}" id="convo-${c.id}" onclick="openConvo('${c.id}')"><div class="avatar">${c.name.charAt(0)}${c.online?'<div class="online-dot"></div>':""}</div><div class="convo-meta"><div class="convo-top"><span class="convo-name">${escHtml(c.name)}</span><span class="convo-time">${c.time}</span></div><div class="convo-preview">${escHtml(lastMsg)}</div></div>${c.unread?`<div class="unread-badge">${c.unread}</div>`:""}</div>`;}).join("");
        }
        function filterConvos(){renderConvoList(document.getElementById("convoSearch").value.toLowerCase());}
        function openConvo(id){
            const convo=CONVERSATIONS.find(c=>c.id===id);if(!convo)return;
            activeConvo=id;convo.unread=0;renderConvoList(document.getElementById("convoSearch").value.toLowerCase());
            document.getElementById("chatAvatar").innerHTML=convo.name.charAt(0)+(convo.online?'<div class="online-dot"></div>':"");
            document.getElementById("chatName").innerText=convo.name;
            document.getElementById("chatStatus").innerText=convo.online?"● Online":"● Offline";
            document.getElementById("chatStatus").style.color=convo.online?"#10b981":"#9ca3af";
            document.getElementById("chatTaskName").innerText=convo.task;
            document.getElementById("chatEmpty").style.display="none";
            const cv=document.getElementById("chatView");cv.style.display="flex";
            renderMessages([...convo.messages,...(localMessages[id]||[])]);
            document.getElementById("msgInput").focus();
        }
        function goToMyTasks(){myTasks();}
        function viewTaskDetails(){const c=CONVERSATIONS.find(c=>c.id===activeConvo);if(c)showToast("Task: "+c.task,"info");}
        function renderMessages(msgs){const c=document.getElementById("chatMessages");c.innerHTML=`<div class="date-separator">Today</div>`+msgs.map(m=>`<div class="message ${m.from==="me"?"sent":"received"}">${escHtml(m.text)}<span class="msg-time">${m.time||"Now"}</span></div>`).join("");c.scrollTop=c.scrollHeight;}
        function sendMessage(e){
            e.preventDefault();const input=document.getElementById("msgInput");const text=input.value.trim();if(!text||!activeConvo)return;
            const now=new Date();const time=now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
            if(!localMessages[activeConvo])localMessages[activeConvo]=[];
            localMessages[activeConvo].push({from:"me",text,time});input.value="";
            const convo=CONVERSATIONS.find(c=>c.id===activeConvo);
            renderMessages([...convo.messages,...localMessages[activeConvo]]);
        }
        function escHtml(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
        document.addEventListener("DOMContentLoaded",function(){renderConvoList();});
    </script>
    <script>
        const MESSAGE_API = "http://localhost:3000/api/messages";
        const USERS_API = "http://localhost:3000/api/users";
        let allUsers = [];

        function renderConvoList(filter = "") {
            const list = document.getElementById("convoList");
            const query = filter.toLowerCase();
            const filtered = CONVERSATIONS.filter(c => c.participant.name.toLowerCase().includes(query) || (c.lastMessage || "").toLowerCase().includes(query));
            list.innerHTML = filtered.length ? filtered.map(c => `<div class="convo-item ${activeConvo === c.conversationId ? "active" : ""}" onclick="openConvo('${c.conversationId}')"><div class="avatar">${escHtml(c.participant.avatar || c.participant.name.charAt(0))}</div><div class="convo-meta"><div class="convo-top"><span class="convo-name">${escHtml(c.participant.name)}</span><span class="convo-time">${new Date(c.lastMessageAt).toLocaleDateString()}</span></div><div class="convo-preview">${escHtml(c.lastMessage || "No messages yet")}</div></div>${c.unread ? `<div class="unread-badge">${c.unread}</div>` : ""}</div>`).join("") : `<div style="padding:32px 20px;color:#285a48;font-size:13px;text-align:center">No conversations yet.</div>`;
        }

        async function loadConversations() {
            const user = currentUser();
            if (!user) return;
            try {
                const response = await fetch(`${MESSAGE_API}/conversations/${encodeURIComponent(user.id)}`);
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to load conversations.");
                CONVERSATIONS.splice(0, CONVERSATIONS.length, ...result.data);
                renderConvoList();
            } catch (error) {
                document.getElementById("convoList").innerHTML = `<div style="padding:32px 20px;color:#a52e2e;font-size:13px;text-align:center">${escHtml(error.message)}</div>`;
            }
        }

        async function loadUsers() {
            const user = currentUser();
            if (!user) return;
            try {
                const response = await fetch(USERS_API);
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error("Unable to load users.");
                allUsers = result.data.filter(member => member.id !== user.id);
            } catch (error) {
                document.getElementById("userResults").innerHTML = `<div style="padding:8px 0;color:#a52e2e;font-size:12px">${escHtml(error.message)}</div>`;
            }
        }

        function searchUsers() {
            const query = document.getElementById("userSearch").value.trim().toLowerCase();
            const results = document.getElementById("userResults");
            if (!query) {
                results.innerHTML = "";
                return;
            }
            const matches = allUsers.filter(member => member.name.toLowerCase().includes(query) || member.email.toLowerCase().includes(query));
            results.innerHTML = matches.length
                ? matches.map(member => `<button class="user-result" type="button" onclick="startConversation('${member.id}')"><span class="user-result-avatar">${escHtml(member.avatar || member.name.charAt(0))}</span><span><span class="user-result-name">${escHtml(member.name)}</span><span class="user-result-email">${escHtml(member.email)}</span></span></button>`).join("")
                : `<div style="padding:8px 0;color:#6b7478;font-size:12px">No users found.</div>`;
        }

        async function startConversation(recipientId) {
            const user = currentUser();
            if (!user) return;
            try {
                const response = await fetch(`${MESSAGE_API}/conversations`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initiatorId: user.id, recipientId }) });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to start conversation.");
                document.getElementById("userSearch").value = "";
                document.getElementById("userResults").innerHTML = "";
                await loadConversations();
                await openConvo(result.data.id);
            } catch (error) {
                showToast(error.message, "error");
            }
        }

        async function openConvo(id) {
            const convo = CONVERSATIONS.find(c => c.conversationId === id);
            const user = currentUser();
            if (!convo || !user) return;
            activeConvo = id;
            renderConvoList(document.getElementById("convoSearch").value.toLowerCase());
            document.getElementById("chatAvatar").innerText = convo.participant.avatar || convo.participant.name.charAt(0);
            document.getElementById("chatName").innerText = convo.participant.name;
            document.getElementById("chatStatus").innerText = "Conversation";
            document.getElementById("chatTaskName").innerText = `${convo.taskTitle} — ₱${Number(convo.taskBudget).toLocaleString()}`;
            try {
                const response = await fetch(`${MESSAGE_API}/conversations/${encodeURIComponent(user.id)}/${encodeURIComponent(id)}`);
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to load messages.");
                document.getElementById("chatEmpty").style.display = "none";
                document.getElementById("chatView").style.display = "flex";
                renderMessages(result.data);
                document.getElementById("msgInput").focus();
            } catch (error) {
                showToast(error.message, "error");
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById("chatMessages");
            container.innerHTML = `<div class="date-separator">Conversation</div>` + messages.map(message => `<div class="message ${message.isMe ? "sent" : "received"}">${escHtml(message.text)}<span class="msg-time">${new Date(message.createdAt).toLocaleString()}</span></div>`).join("");
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            const user = currentUser();
            if (!text || !activeConvo || !user) return;
            const button = document.getElementById("sendBtn");
            button.disabled = true;
            try {
                const response = await fetch(MESSAGE_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ conversationId: activeConvo, senderId: user.id, text }) });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to send message.");
                input.value = "";
                await openConvo(activeConvo);
            } catch (error) {
                showToast(error.message, "error");
            } finally {
                button.disabled = false;
            }
        }

        document.addEventListener("DOMContentLoaded", async function() {
            await loadUsers();
            await loadConversations();
        });
    </script>
</body>
</html>
