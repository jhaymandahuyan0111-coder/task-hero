<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHero - My Tasks</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
.page-header { margin-bottom: 24px; }
.page-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.page-header p { color: var(--text-sub); font-size: 14px; }

/* ── TABS ────────────────────────────────────────────── */
.tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
}
.tab-btn {
    padding: 10px 18px;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-sub);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 600;
}
.tab-section { display: none; }
.tab-section.active { display: block; }

/* ── TASK ROWS ───────────────────────────────────────── */
.my-task-list { display: block; }
.my-task-card {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px 20px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
    align-items: start;
    transition: background 0.1s;
}
.my-task-card:last-child { border-bottom: none; }
.my-task-card:hover { background: var(--surface); }
.task-info { min-width: 0; }
.task-cat-tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 4px;
}
.task-info h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.task-info p { color: var(--text-sub); font-size: 13px; margin-bottom: 2px; }
.task-price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    flex-wrap: wrap;
    gap: 8px;
}
.task-price { font-size: 16px; font-weight: 700; color: var(--text); }
.task-actions { display: flex; gap: 6px; align-items: center; }
.task-action-btn {
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    transition: color 0.15s, background 0.15s;
}
.btn-view    { color: var(--text-sub); }
.btn-view:hover { color: var(--text); background: var(--surface); }
.btn-delete  { color: var(--danger); }
.btn-delete:hover { background: #fef2f2; }
.btn-complete { color: var(--success); }
.btn-complete:hover { background: #f0fdf4; }

/* ── STATUS ──────────────────────────────────────────── */
.status-col { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: 2px; }
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
}
.status-badge::before { content: "•"; font-size: 16px; line-height: 1; margin-bottom: 1px; }
.badge-open      { background: #fef9c3; color: #854d0e; }
.badge-open::before { color: #ca8a04; }
.badge-accepted  { background: #dcfce7; color: #166534; }
.badge-accepted::before { color: #16a34a; }
.badge-completed { background: #ede9fe; color: #4c1d95; }
.badge-completed::before { color: #7c3aed; }
.badge-cancelled { background: #fee2e2; color: #991b1b; }
.badge-cancelled::before { color: #dc2626; }

/* ── EMPTY STATE ─────────────────────────────────────── */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-sub);
}
.empty-state h3 { margin-bottom: 6px; font-size: 16px; font-weight: 600; color: var(--text); }
.empty-state p  { margin-bottom: 20px; font-size: 14px; }

/* ── DARK MODE ───────────────────────────────────────── */
body.dark-mode .page-header p { color: var(--text-sub); }
body.dark-mode .tab-btn { color: var(--text-sub); }
body.dark-mode .tab-btn:hover { color: var(--text); }
body.dark-mode .tab-btn.active { color: var(--primary); }
body.dark-mode .task-info h3 { color: var(--text); }
body.dark-mode .task-info p { color: var(--text-sub); }
body.dark-mode .task-price { color: var(--text); }
body.dark-mode .task-cat-tag { color: var(--text-sub); }
body.dark-mode .btn-view:hover { background: var(--surface); }
body.dark-mode .btn-delete:hover { background: rgba(220,38,38,0.12); }
body.dark-mode .btn-complete:hover { background: rgba(22,163,74,0.12); }
body.dark-mode .badge-open      { background: rgba(202,138,4,0.15);   color: #fbbf24; }
body.dark-mode .badge-accepted  { background: rgba(22,163,74,0.15);   color: #4ade80; }
body.dark-mode .badge-completed { background: rgba(124,58,237,0.15);  color: #a78bfa; }
body.dark-mode .badge-cancelled { background: rgba(220,38,38,0.12);   color: #f87171; }
body.dark-mode .empty-state h3  { color: var(--text); }

@media (max-width: 600px) {
    .my-task-card { grid-template-columns: 1fr; }
    .status-col { flex-direction: row; align-items: center; }
    .page-header h1 { font-size: 20px; }
    .tabs { overflow-x: auto; }
    .tab-btn { white-space: nowrap; }
}
    </style>
</head>
<body>
    <div id="shared-navigation"></div>
    <main class="page-container">
        <div class="page-header">
            <h1>My Tasks</h1>
            <p>Manage the tasks you posted and the tasks you accepted.</p>
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="postedTab" onclick="switchTab('posted')">Tasks I Posted</button>
            <button class="tab-btn" id="acceptedTab" onclick="switchTab('accepted')">Tasks I Accepted</button>
        </div>
        <div class="tab-section active" id="postedSection">
            <div class="my-task-list" id="postedList"></div>
        </div>
        <div class="tab-section" id="acceptedSection">
            <div class="my-task-list" id="acceptedList"></div>
        </div>
    </main>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <h2>Delete this task?</h2>
            <div style="margin-bottom:20px"><p>This will permanently remove <strong id="deleteTaskName"></strong> from your posted tasks.</p></div>
            <div class="modal-buttons">
                <button class="modal-cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="modal-confirm" style="background:var(--danger)" onclick="confirmDelete()">Delete Task</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-box" style="max-width:520px">
            <h2 id="detailTitle" style="margin-bottom:14px"></h2>
            <div id="detailBody" style="margin-bottom:20px"></div>
            <div class="modal-buttons">
                <button class="modal-confirm" onclick="document.getElementById('detailModal').classList.remove('open')">Close</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        let pendingDeleteId = null;

        function switchTab(tab) {
            document.querySelectorAll(".tab-section").forEach(s => s.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(tab + "Section").classList.add("active");
            document.getElementById(tab + "Tab").classList.add("active");
        }

        function loadMyTasks() { renderPosted(); renderAccepted(); }

        function renderPosted() {
            const user = JSON.parse(localStorage.getItem("taskhero-user") || "null");
            const tasks = JSON.parse(localStorage.getItem("taskhero-tasks") || "[]").filter(t => user && t.postedBy === user.id);
            const list = document.getElementById("postedList");
            if (!tasks.length) {
                list.innerHTML = emptyState("No posted tasks yet", "Post a task and let the community help you out.", "Post a Task", "postTask()");
                return;
            }
            list.innerHTML = tasks.map(task => `
                <div class="my-task-card" id="card-${task.id}">
                    <div class="task-info">
                        <span class="task-cat-tag">${escHtml(task.category)}</span>
                        <h3>${escHtml(task.title)}</h3>
                        <p>${escHtml(task.location)}${task.deadline ? " · " + formatDate(task.deadline) : ""}</p>
                        <p style="color:var(--text-sub);font-size:12px;margin-top:4px">${escHtml(task.description.substring(0, 100))}${task.description.length > 100 ? "…" : ""}</p>
                        <div class="task-price-row">
                            <span class="task-price">₱${Number(task.budget).toLocaleString()}</span>
                            <div class="task-actions">
                                <button class="task-action-btn btn-view" onclick="viewTask('${task.id}','posted')">View</button>
                                <button class="task-action-btn btn-delete" onclick="openDeleteModal('${task.id}','${escHtml(task.title)}')">Delete</button>
                            </div>
                        </div>
                    </div>
                    <div class="status-col"><span class="status-badge ${statusClass(task.status)}">${capitalize(task.status)}</span></div>
                </div>`).join("");
        }

        function renderAccepted() {
            const tasks = JSON.parse(localStorage.getItem("taskhero-accepted") || "[]");
            const list = document.getElementById("acceptedList");
            if (!tasks.length) {
                list.innerHTML = emptyState("No accepted tasks yet", "Browse open tasks and accept one to get started.", "Browse Tasks", "goHome()");
                return;
            }
            list.innerHTML = tasks.map(task => `
                <div class="my-task-card" id="acc-card-${task.id}">
                    <div class="task-info">
                        <span class="task-cat-tag">${escHtml(task.category)}</span>
                        <h3>${escHtml(task.title)}</h3>
                        <p>${escHtml(task.location)}${task.deadline ? " · " + formatDate(task.deadline) : ""}</p>
                        <p style="color:var(--text-sub);font-size:12px;margin-top:4px">${escHtml(task.description.substring(0, 100))}${task.description.length > 100 ? "…" : ""}</p>
                        <div class="task-price-row">
                            <span class="task-price">₱${Number(task.budget).toLocaleString()}</span>
                            <div class="task-actions">
                                <button class="task-action-btn btn-view" onclick="viewTask('${task.id}','accepted')">View</button>
                                ${task.status === "accepted" ? `<button class="task-action-btn btn-complete" onclick="markComplete('${task.id}')">Mark Done</button>` : ""}
                            </div>
                        </div>
                    </div>
                    <div class="status-col"><span class="status-badge ${statusClass(task.status)}">${capitalize(task.status)}</span></div>
                </div>`).join("");
        }

        function viewTask(id, source) {
            let task;
            if (source === "posted") { const tasks = JSON.parse(localStorage.getItem("taskhero-tasks") || "[]"); task = tasks.find(t => t.id === id); }
            else { const acc = JSON.parse(localStorage.getItem("taskhero-accepted") || "[]"); task = acc.find(t => t.id === id); }
            if (!task) return;
            document.getElementById("detailTitle").innerText = task.title;
            document.getElementById("detailBody").innerHTML = `
                <p style="color:var(--text-sub);font-size:13px;line-height:1.6;margin-bottom:16px">${escHtml(task.description)}</p>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">
                    <div><strong style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sub)">Location</strong><br><span>${escHtml(task.location)}</span></div>
                    <div><strong style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sub)">Deadline</strong><br><span>${task.deadline ? formatDate(task.deadline) : "Flexible"}</span></div>
                    <div><strong style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sub)">Budget</strong><br><span style="font-weight:700;font-size:18px">₱${Number(task.budget).toLocaleString()}</span></div>
                    <div><strong style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sub)">Status</strong><br><span class="status-badge ${statusClass(task.status)}" style="margin-top:4px;display:inline-flex">${capitalize(task.status)}</span></div>
                </div>`;
            document.getElementById("detailModal").classList.add("open");
        }

        document.getElementById("detailModal").addEventListener("click", function(e) { if (e.target === this) this.classList.remove("open"); });

        function markComplete(id) {
            const acc = JSON.parse(localStorage.getItem("taskhero-accepted") || "[]");
            const idx = acc.findIndex(t => t.id === id);
            if (idx !== -1) { acc[idx].status = "completed"; localStorage.setItem("taskhero-accepted", JSON.stringify(acc)); renderAccepted(); showToast("Task marked as completed.", "success"); }
        }

        function openDeleteModal(id, name) {
            pendingDeleteId = id;
            document.getElementById("deleteTaskName").innerText = `"${name}"`;
            document.getElementById("deleteModal").classList.add("open");
        }

        function closeDeleteModal() { document.getElementById("deleteModal").classList.remove("open"); pendingDeleteId = null; }

        function confirmDelete() {
            if (!pendingDeleteId) return;
            let tasks = JSON.parse(localStorage.getItem("taskhero-tasks") || "[]");
            tasks = tasks.filter(t => t.id !== pendingDeleteId);
            localStorage.setItem("taskhero-tasks", JSON.stringify(tasks));
            closeDeleteModal();
            renderPosted();
            showToast("Task deleted.", "info");
        }

        document.getElementById("deleteModal").addEventListener("click", function(e) { if (e.target === this) closeDeleteModal(); });

        function statusClass(s) { return { open:"badge-open", accepted:"badge-accepted", completed:"badge-completed", cancelled:"badge-cancelled" }[s] || "badge-open"; }
        function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }
        function formatDate(d) { if (!d) return ""; return new Date(d).toLocaleDateString("en-PH", { month: "short", day: "numeric" }); }
        function escHtml(str) { return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
        function emptyState(title, desc, btnLabel, btnAction) {
            return `<div class="empty-state"><h3>${title}</h3><p>${desc}</p><button class="primary-button" onclick="${btnAction}">${btnLabel}</button></div>`;
        }

        document.addEventListener("DOMContentLoaded", loadMyTasks);
    </script>
</body>
</html>
